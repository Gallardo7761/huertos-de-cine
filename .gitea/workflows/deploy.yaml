name: Build & Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.gitea/workflows/**'
            frontend:
              - 'frontend/**'
              - '.gitea/workflows/**'

  test-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    # El job no llega a los puertos de los contenedores que arrancaría Testcontainers:
    # los tests de integración usan estos services
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
      lldap:
        image: lldap/lldap:stable
        env:
          LLDAP_JWT_SECRET: jwt-secret-for-tests-jwt-secret
          LLDAP_KEY_SEED: key-seed-for-tests-key-seed
          LLDAP_LDAP_USER_PASS: admin-password-for-tests
          LLDAP_LDAP_BASE_DN: dc=huertos,dc=test
    env:
      IT_DATASOURCE_URL: jdbc:postgresql://postgres:5432/test
      IT_DATASOURCE_USERNAME: test
      IT_DATASOURCE_PASSWORD: test
      IT_LLDAP_URL: http://lldap:17170
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven

      - name: Run tests
        working-directory: ./backend
        run: |
          for i in $(seq 1 30); do (echo > /dev/tcp/postgres/5432) 2>/dev/null && break; sleep 2; done
          for i in $(seq 1 30); do (echo > /dev/tcp/lldap/17170) 2>/dev/null && break; sleep 2; done
          ./mvnw -B verify

  lint-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint

  build-backend:
    needs: [changes, test-backend]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login Registry
        uses: docker/login-action@v3
        with:
          registry: git.killobyte.es
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            git.killobyte.es/gallardo7761/huertos-cine-back:latest
            git.killobyte.es/gallardo7761/huertos-cine-back:${{ gitea.sha }}

  build-frontend:
    needs: [changes, lint-frontend]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login Registry
        uses: docker/login-action@v3
        with:
          registry: git.killobyte.es
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          tags: |
            git.killobyte.es/gallardo7761/huertos-cine-front:latest
            git.killobyte.es/gallardo7761/huertos-cine-front:${{ gitea.sha }}

  deploy:
    needs: [changes, build-backend, build-frontend]
    if: always() && (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Hetzner
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT }}
          script: |
            cd /opt/docker
            docker compose pull cine-backend cine-frontend
            docker compose up -d cine-backend cine-frontend
            docker image prune -f
