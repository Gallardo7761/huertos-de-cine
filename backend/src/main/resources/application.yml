server:
  port: ${SERVER_PORT:10000}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/v2/cine}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME_CINE:huertos-de-cine-service}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/miarma_v3?currentSchema=cine}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTHELIA_ISSUER_URI:https://id.miarma.net}

  jackson:
    default-property-inclusion: non_null
    time-zone: Europe/Madrid

logging:
  level:
    root: INFO
    net.miarma.backend.huertosdecine: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info